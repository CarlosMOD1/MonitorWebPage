<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Failure Monitoring</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0F1923;color:#F4F6F8;height:100vh;overflow:hidden;display:flex;flex-direction:column}
/* Layout */
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:175px;min-width:175px;background:#0A1420;display:flex;flex-direction:column;overflow:hidden}
.sidebar-title{padding:10px 12px;font-size:10px;font-weight:700;color:#2E9CDB;letter-spacing:1px;border-bottom:1px solid #1A2B3C}
.st-list{overflow-y:auto;flex:1}
.st-item{display:flex;flex-direction:column;padding:8px 12px;cursor:pointer;border-left:3px solid transparent;transition:background .15s}
.st-item:hover{background:#111D2B}
.st-item.active{background:#1E3A5F;border-left:3px solid #2E9CDB}
.sn{font-size:11px;font-weight:600;color:#F4F6F8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sy-bar{height:4px;background:#1A2B3C;border-radius:2px;margin:3px 0}
.sy-fill{height:4px;border-radius:2px;transition:width .3s}
.sf{font-size:9px;color:#8B9BAA}
.main{flex:1;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
/* Product tabs */
.pg-tabs{display:flex;gap:5px;padding:7px 12px;background:#0A1420;border-bottom:1px solid #1A2B3C;flex-wrap:wrap;flex-shrink:0}
.pg-tab{padding:4px 13px;border-radius:12px;cursor:pointer;background:#1A2B3C;color:#8B9BAA;font-size:10px;font-weight:700;white-space:nowrap;border:1px solid #2C3E50;transition:all .15s}
.pg-tab:hover{background:#1E3A5F;color:#F4F6F8}
.pg-tab.active{background:#1E6FBA;color:#fff;border-color:#1E6FBA}
/* Header */
.hdr{padding:10px 16px;background:linear-gradient(135deg,#0F1923,#1A2B3C);border-bottom:1px solid #1E6FBA;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:17px;font-weight:700;color:#F4F6F8}
.hdr h1 span{color:#F1C40F}
.period{font-size:11px;color:#00D4AA;margin-top:2px}
.date-range{display:flex;gap:6px;align-items:center}
.date-range label{font-size:10px;color:#8B9BAA}
.date-range input{background:#1A2B3C;border:1px solid #2C3E50;color:#F4F6F8;padding:3px 7px;border-radius:6px;font-size:10px;cursor:pointer}
.btn-refresh{background:#1E6FBA;color:#fff;border:none;padding:4px 12px;border-radius:6px;font-size:10px;cursor:pointer;font-weight:700}
.btn-refresh:hover{background:#2E9CDB}
.btn-refresh:disabled{background:#2C3E50;cursor:not-allowed}
.btn-real{background:transparent;color:#FF6B35;border:1px solid #FF6B35;padding:4px 12px;border-radius:6px;font-size:10px;cursor:pointer;font-weight:700;transition:all .15s}
.btn-real:hover{background:rgba(255,107,53,0.15)}
.btn-real.active{background:#FF6B35;color:#fff}
/* KPIs */
.kpis{display:flex;gap:8px;padding:8px 12px;flex-shrink:0}
.kpi{flex:1;background:#1A2B3C;border-radius:8px;padding:10px 12px;text-align:center}
.kv{font-size:22px;font-weight:700}
.kl{font-size:9px;color:#8B9BAA;letter-spacing:1px;margin-top:2px}
/* Content */
.content-area{flex:1;display:flex;gap:8px;padding:8px 12px;min-height:500px}
.tbl-wrap{flex:1;background:#1A2B3C;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.tbl-hdr{padding:8px 12px;font-size:10px;font-weight:700;color:#2E9CDB;letter-spacing:1px;border-bottom:1px solid #0F1923}
.tbl-scroll{overflow-y:auto;flex:1}
table{width:100%;border-collapse:collapse}
th{padding:6px 8px;font-size:9px;color:#8B9BAA;text-align:left;background:#0F1923;position:sticky;top:0}
td{padding:5px 8px;font-size:11px;border-bottom:1px solid #0F1923;color:#8B9BAA}
tbody tr:hover td{background:#1E3A5F}
/* Right panel */
.right{flex:1.9;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.pie-wrap{background:#1A2B3C;border-radius:8px;padding:10px 12px;flex:1;display:flex;flex-direction:column;overflow:hidden}
.section-title{font-size:10px;font-weight:700;color:#2E9CDB;letter-spacing:1px;margin-bottom:8px}
.pie-svg-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.pie-svg-wrap svg{width:100%;height:100%;max-height:100%}
.pie-slice{cursor:pointer;transition:transform .18s ease}
.pie-tooltip{position:absolute;background:#0F1923;border:1px solid #2E9CDB;color:#F4F6F8;padding:5px 10px;border-radius:6px;font-size:11px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .15s;z-index:10}
.top3-wrap{background:#1A2B3C;border-radius:8px;padding:10px 12px;flex-shrink:0}
.t3-item{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.t3-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.t3-bar-wrap{flex:1}
.t3-name{font-size:10px;color:#F4F6F8;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t3-bar{height:6px;border-radius:3px;transition:width .4s}
.t3-qty{font-size:11px;font-weight:700;min-width:50px;text-align:right}
.no-data{padding:20px;text-align:center;color:#8B9BAA;font-size:11px}
/* Loading overlay */
.loading-overlay{position:fixed;inset:0;background:rgba(15,25,35,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:14px}
.spinner{width:44px;height:44px;border:4px solid #1A2B3C;border-top:4px solid #2E9CDB;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{font-size:13px;color:#8B9BAA}
.loading-overlay.hidden{display:none}
/* ── Anomaly alert panel ───────────────────────────── */
.anomaly-panel{background:#0A1420;border-bottom:2px solid #1A2B3C;flex-shrink:0;overflow:hidden}
.anomaly-panel.has-critical{border-bottom-color:#E74C3C}
.anomaly-panel.has-warning{border-bottom-color:#F1C40F}

/* Header bar */
.anomaly-header{display:flex;align-items:center;gap:10px;padding:6px 16px;cursor:pointer;user-select:none;transition:background .15s}
.anomaly-header:hover{background:#0d1c2b}
.ap-icon{font-size:13px;line-height:1}
.ap-title{font-size:10px;font-weight:700;color:#5A6A7A;letter-spacing:1.2px;text-transform:uppercase}
.ap-status{font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}
.ap-status.ok{color:#00D4AA}
.ap-status.warning{color:#F1C40F}
.ap-status.critical{color:#FF5A5F}
.ap-counts{display:flex;gap:5px;margin-left:2px}
.ap-pill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.5px}
.ap-pill.critical{background:rgba(231,76,60,.2);color:#FF5A5F;border:1px solid rgba(231,76,60,.4)}
.ap-pill.warning{background:rgba(241,196,15,.15);color:#F1C40F;border:1px solid rgba(241,196,15,.35)}
.ap-ts{font-size:9px;color:#2C3E50;margin-left:auto}
.ap-chevron{font-size:10px;color:#2C3E50;transition:transform .25s;margin-left:6px}
.ap-chevron.open{transform:rotate(180deg)}

/* Pulsing dot for critical */
@keyframes ap-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.ap-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ap-dot.critical{background:#FF5A5F;animation:ap-pulse 1.4s ease-in-out infinite}
.ap-dot.warning{background:#F1C40F}
.ap-dot.ok{background:#00D4AA}

/* Cards tray */
.anomaly-body{padding:8px 16px 12px;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden}
.anomaly-body::-webkit-scrollbar{height:3px}
.anomaly-body::-webkit-scrollbar-track{background:transparent}
.anomaly-body::-webkit-scrollbar-thumb{background:#1E3A5F;border-radius:2px}

/* Alert card */
.alert-card{
  background:#101E2C;border:1px solid #1E3A5F;border-radius:8px;
  padding:10px 14px;min-width:210px;max-width:240px;flex-shrink:0;
  border-top:3px solid #1E3A5F;position:relative;overflow:hidden;
  transition:border-color .2s,box-shadow .2s;cursor:default
}
.alert-card::before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:8px;transition:opacity .2s}
.alert-card.critical{border-top-color:#E74C3C;box-shadow:0 0 0 0 rgba(231,76,60,0)}
.alert-card.warning{border-top-color:#F1C40F}
.alert-card.critical.pulse-glow{animation:card-glow 2s ease-in-out infinite}
@keyframes card-glow{0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,0)}50%{box-shadow:0 0 12px 2px rgba(231,76,60,.25)}}

/* Card content */
.ac-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:6px}
.ac-station{font-size:12px;font-weight:700;color:#E6EDF3;line-height:1.3;max-width:155px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-prod-pill{font-size:8px;font-weight:700;padding:2px 6px;border-radius:8px;background:#0F2A3F;color:#2E9CDB;border:1px solid #1E3A5F;white-space:nowrap;flex-shrink:0;margin-top:1px}
.ac-metrics{display:flex;gap:8px}
.ac-metric{flex:1;background:#0A1420;border-radius:5px;padding:5px 7px}
.ac-metric-label{font-size:8px;color:#5A6A7A;font-weight:700;letter-spacing:.8px;margin-bottom:3px;text-transform:uppercase}
.ac-metric-val{font-size:15px;font-weight:700;line-height:1}
.ac-metric-sub{font-size:8px;color:#5A6A7A;margin-top:2px}
.ac-tag{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:7px;letter-spacing:.3px}
.ac-tag.drop-tag{background:rgba(231,76,60,.12);color:#FF5A5F;border:1px solid rgba(231,76,60,.25)}
.ac-tag.streak-tag{background:rgba(241,196,15,.1);color:#F1C40F;border:1px solid rgba(241,196,15,.25)}
.ac-tags{display:flex;gap:5px;flex-wrap:wrap}
/* Status bar */
.status-bar{background:#0A1420;border-top:1px solid #1A2B3C;padding:3px 14px;font-size:9px;color:#2C3E50;display:flex;gap:16px;flex-shrink:0}
.status-bar .ok{color:#00D4AA}
.status-bar .err{color:#E74C3C}
/* Last updated */
.refresh-info{display:flex;align-items:center;gap:6px;margin-left:auto}
/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#0A1420}
::-webkit-scrollbar-thumb{background:#2C3E50;border-radius:2px}
  /* Modal */
  .modal-overlay {
    display: none; position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.7); z-index: 2000;
    align-items: center; justify-content: center;
  }
  .modal-content {
    background: #142131; border: 1px solid #2C3E50; border-radius: 8px;
    width: 90%; max-width: 900px; max-height: 80vh; display: flex; flex-direction: column;
  }
  .modal-header {
    padding: 15px; border-bottom: 1px solid #2C3E50; display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h3 { margin: 0; color: #E6EDF3; }
  .close-btn { background: none; border: none; color: #FF5A5F; font-size: 24px; cursor: pointer; line-height: 1; }
  .modal-body { padding: 15px; overflow-y: auto; }
  #modalTable td { font-size: 11px; }
  .notes-cell {
    max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer; transition: all .2s;
  }
  .notes-cell.expanded {
    white-space: pre-wrap; word-break: break-word; max-width: none;
  }
</style>
</head>
<body>
  <div class="modal-overlay" id="detailsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Detalles</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <table class="data-table" id="modalTable">
          <thead>
            <tr>
              <th>QR</th>
              <th>Station</th>
              <th>Tipo de Falla</th>
              <th>Failure Code</th>
              <th>Notas</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-msg" id="loadingMsg">Connecting to database...</div>
</div>

<!-- Tabs row -->
<div class="pg-tabs" id="pgTabs"></div>

<!-- Anomaly alert panel -->
<div class="anomaly-panel" id="anomalyPanel">
  <div class="anomaly-header" onclick="toggleAnomalyPanel()">
    <span class="ap-icon">&#9889;</span>
    <span class="ap-title">Anomaly Detection</span>
    <span class="ap-dot ok" id="apDot"></span>
    <span class="ap-status ok" id="apStatus">Scanning...</span>
    <span class="ap-counts" id="apCounts"></span>
    <span class="ap-ts" id="apTs"></span>
    <span class="ap-chevron" id="apChevron">&#9660;</span>
  </div>
  <div id="anomalyBody" style="display:none">
    <div class="anomaly-body" id="anomalyCards"></div>
  </div>
</div>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-title">&#9632; STATIONS</div>
    <div class="st-list" id="stList"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="hdr">
      <div>
        <h1>&#9889; Failure <span>Monitoring</span></h1>
        <div class="period" id="periodLabel"></div>
      </div>
      <div class="date-range">
        <button class="btn-refresh" style="background:#8B9BAA;margin-right:4px;" onclick="openMonitor()">Monitor</button>
        <button class="btn-refresh" style="background:#27AE60;margin-right:10px;" onclick="openRty()">RTY</button>
        <button class="btn-real" id="btnReal" onclick="toggleRealFailures()">&#9888; Fallas Reales</button>
        <label>From</label>
        <input type="date" id="dateFrom">
        <label>To</label>
        <input type="date" id="dateTo">
        <button class="btn-refresh" id="btnFilter" onclick="applyDateFilter()">&#128260; Filter</button>
      </div>
    </div>

    <div class="kpis" id="kpiCards"></div>

    <div class="content-area">
      <div class="tbl-wrap">
        <div class="tbl-hdr">TOP FAILURES</div>
        <div class="tbl-scroll">
          <table>
            <thead>
              <tr>
                <th>FAILURE TYPE</th>
                <th>STATION</th>
                <th style="text-align:center">QTY</th>
                <th style="width:90px">DIST.</th>
              </tr>
            </thead>
            <tbody id="failTable"></tbody>
          </table>
        </div>
      </div>
      <div class="right">
        <div style="display:flex;gap:8px;flex:1;overflow:hidden">
          <div class="pie-wrap" style="flex:1">
            <div class="section-title">PASS / FAIL</div>
            <div class="pie-svg-wrap" id="passFailPieWrap">
              <div class="pie-tooltip" id="passFailTooltip"></div>
            </div>
          </div>
          <div class="pie-wrap" style="flex:1">
            <div class="section-title">FAILURE DISTRIBUTION</div>
            <div class="pie-svg-wrap" id="pieSvgWrap">
              <div class="pie-tooltip" id="pieTooltip"></div>
            </div>
          </div>
        </div>
        <div class="top3-wrap">
          <div class="section-title">TOP 3 FAILURES</div>
          <div id="top3Container"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Status bar -->
<div class="status-bar">
  <span id="statusMsg">—</span>
  <div class="refresh-info">
    <span id="refreshCountdown"></span>
  </div>
</div>

<script>
const COLORS  = ['#FF6B35','#2E9CDB','#9B59B6','#00D4AA','#F1C40F','#E74C3C','#27AE60'];
let DATA          = null;
let GROUP_NAMES   = [];
let activeProduct = 'all';
let activeStation = 'all';
let realFailuresMode = false;

// ── Default dates ───────────────────────────────────
function defaultDates() {
  const today = new Date();
  const from  = new Date(today);
  from.setDate(today.getDate() - 30);
  const fmt = d => d.toISOString().slice(0,10);
  return { from: fmt(from), to: fmt(today) };
}

function initDates() {
  const d = defaultDates();
  document.getElementById('dateFrom').value = d.from;
  document.getElementById('dateTo').value   = d.to;
}

// ── Session persistence ──────────────────────────────
const _SESSION_KEY = 'dashboard_filters_v1';

function saveFilters() {
  try {
    sessionStorage.setItem(_SESSION_KEY, JSON.stringify({
      dateFrom: document.getElementById('dateFrom').value,
      dateTo:   document.getElementById('dateTo').value,
      activeProduct,
      realFailuresMode,
    }));
  } catch (_) {}
}

function restoreFilters() {
  try {
    const raw = sessionStorage.getItem(_SESSION_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (s.dateFrom) document.getElementById('dateFrom').value = s.dateFrom;
    if (s.dateTo)   document.getElementById('dateTo').value   = s.dateTo;
    if (s.activeProduct != null) activeProduct = s.activeProduct;
    if (s.realFailuresMode != null) {
      realFailuresMode = s.realFailuresMode;
      const btn = document.getElementById('btnReal');
      btn.classList.toggle('active', realFailuresMode);
      btn.innerHTML = realFailuresMode ? '&#9888; Total Fallas' : '&#9888; Fallas Reales';
    }
    return true;
  } catch (_) {
    return false;
  }
}

// ── Fetch data from API ─────────────────────────────
async function loadData(dateFrom, dateTo) {
  showLoading(true, 'Querying in-memory data...');
  setFilterEnabled(false);
  try {
    const res = await fetch(`/api/data?from=${dateFrom}&to=${dateTo}&real_failures=${realFailuresMode}`);
    const json = await res.json();
    if (res.status === 503) {
      setStatus(`Server is booting: ${json.error}`, true);
      showLoading(true, 'The server is doing its initial 1-year database load, please wait...');
      setTimeout(() => loadData(dateFrom, dateTo), 10000); // Reintenta en 10 seg
      return;
    }
    if (!res.ok || json.error) {
      setStatus(`Error: ${json.error || 'Server error'}`, true);
      showLoading(false);
      setFilterEnabled(true);
      return;
    }
    DATA        = json;
    GROUP_NAMES = json.groups || [];
    activeStation = 'all';
    render();
    setStatus(`Updated: ${json.lastUpdated} | Records: ${json.overall.total.toLocaleString('en-US')}`, false);
  } catch(e) {
    setStatus(`Connection error: ${e.message}`, true);
  } finally {
    showLoading(false);
    setFilterEnabled(true);
  }
}

function applyDateFilter() {
  const from = document.getElementById('dateFrom').value;
  const to   = document.getElementById('dateTo').value;
  if (!from || !to) return;
  saveFilters();
  loadData(from, to);
}

function openMonitor() {
  const toDate = document.getElementById('dateTo').value || new Date().toISOString().slice(0,10);
  const stFilter = (activeStation !== 'all' && activeStation != null) ? `&stationid=${encodeURIComponent(activeStation)}` : '';
  window.location.href = `/monitor?product=${encodeURIComponent(activeProduct)}&date=${toDate}${stFilter}`;
}

function openRty() {
  const from = document.getElementById('dateFrom').value;
  const to   = document.getElementById('dateTo').value;
  const prod = activeProduct !== 'all' ? `&product=${encodeURIComponent(activeProduct)}` : '';
  window.location.href = `/rty?from=${from}&to=${to}${prod}`;
}

// ── UI helpers ──────────────────────────────────────
function showLoading(visible, msg) {
  const el = document.getElementById('loadingOverlay');
  el.classList.toggle('hidden', !visible);
  if (msg) document.getElementById('loadingMsg').textContent = msg;
}

function setStatus(msg, isError) {
  const el = document.getElementById('statusMsg');
  el.textContent  = msg;
  el.className    = isError ? 'err' : 'ok';
}

function setFilterEnabled(enabled) {
  document.getElementById('btnFilter').disabled = !enabled;
}

function yieldColor(y) {
  return y >= 95 ? '#00D4AA' : y >= 85 ? '#F1C40F' : '#E74C3C';
}
function fmt(n) {
  return n == null ? '0' : n.toLocaleString('en-US');
}

// ── Filtered data ───────────────────────────────────
function getFailures() {
  let rows = DATA.failures;
  if (activeProduct !== 'all') rows = rows.filter(r => r.producto === activeProduct);
  if (activeStation !== 'all') rows = rows.filter(r => r.sid === activeStation);
  return rows;
}

function getStations() {
  let rows = DATA.stations;
  if (activeProduct !== 'all') rows = rows.filter(r => r.producto === activeProduct);
  return rows;
}

function getCurrentKPI() {
  if (activeStation !== 'all') {
    const st = DATA.stations.find(s => s.id === activeStation);
    return st || { total:0, failed:0, passed:0, yield:0, fpy:0 };
  }
  if (activeProduct !== 'all') {
    return DATA.byProduct[activeProduct] || { total:0, failed:0, passed:0, yield:0, fpy:0 };
  }
  return DATA.overall;
}

// ── Render KPIs ─────────────────────────────────────
function renderKPIs() {
  if (realFailuresMode && DATA.passFailPie) {
    // En modo fallas reales, usar los datos QR-level del backend
    const pf = getPassFailData();
    const total = (pf.total != null) ? pf.total : (pf.passed + pf.failed);
    const yieldVal = total ? (pf.passed / total * 100) : 0;
    const yc = yieldColor(yieldVal);
    document.getElementById('kpiCards').innerHTML = `
      <div class="kpi" style="border-top:2px solid #2E9CDB">
        <div class="kv" style="color:#2E9CDB">${fmt(total)}</div>
        <div class="kl">UNIQUE QRs</div>
      </div>
      <div class="kpi" style="border-top:2px solid #FF6B35">

// ── SVG Pie helpers ──────────────────────────────────
function polarXY(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function slicePath(cx, cy, r, startDeg, endDeg) {
  // Handle full circle (100%)
  if (endDeg - startDeg >= 360) endDeg = startDeg + 359.9999;
  const s = polarXY(cx, cy, r, startDeg);
  const e = polarXY(cx, cy, r, endDeg);
  const large = endDeg - startDeg > 180 ? 1 : 0;
  return `M${cx},${cy} L${s.x.toFixed(2)},${s.y.toFixed(2)} A${r},${r} 0 ${large} 1 ${e.x.toFixed(2)},${e.y.toFixed(2)} Z`;
}

// ── Render Pie + Top3 ────────────────────────────────
function renderPieTop3() {
  const rows = getFailures();
  const agg  = {};
  rows.forEach(r => { agg[r.falla] = (agg[r.falla] || 0) + r.qty; });
  const sorted = Object.entries(agg).sort((a,b) => b[1]-a[1]);
  const total  = sorted.reduce((s,e) => s+e[1], 0);
  const wrap   = document.getElementById('pieSvgWrap');
  const tip    = document.getElementById('pieTooltip');

  if (!total) {
    wrap.innerHTML = '<div class="pie-tooltip" id="pieTooltip"></div><div class="no-data" style="margin:auto">No data</div>';
    document.getElementById('top3Container').innerHTML = '<div class="no-data">No data</div>';
    return;
  }

  // Build SVG — omit slices < 0.5%
  const visible = sorted.filter(e => e[1] / total >= 0.005);
  const cx = 100, cy = 100, r = 85, labelR = 58;
  let svgPaths = '', svgLabels = '';
  let startDeg = 0;

  visible.forEach((e, i) => {
    const pct    = e[1] / total;
    const deg    = pct * 360;
    const endDeg = startDeg + deg;
    const color  = COLORS[i % COLORS.length];
    const midDeg = startDeg + deg / 2;
    const midRad = (midDeg - 90) * Math.PI / 180;
    // pull-out translate direction
    const tx = Math.cos(midRad) * 10;
    const ty = Math.sin(midRad) * 10;
    const d  = slicePath(cx, cy, r, startDeg, endDeg);
    const pctLabel = (pct * 100).toFixed(1) + '%';
    const name = e[0].replace(/"/g, '&quot;');

    svgPaths += `<path class="pie-slice" d="${d}" fill="${color}" stroke="#0F1923" stroke-width="1"
      data-name="${name}" data-qty="${e[1]}" data-pct="${pctLabel}" data-tx="${tx.toFixed(2)}" data-ty="${ty.toFixed(2)}"
      onmouseenter="sliceEnter(this,event)" onmouseleave="sliceLeave(this)" onmousemove="sliceMove(event)"
      onclick="showDetails('${name}')"/>`;

    // Labels: only for slices >= 4% so text fits
    if (pct >= 0.04) {
      const lx = cx + labelR * Math.cos(midRad);
      const ly = cy + labelR * Math.sin(midRad);
      // Truncate long names
      const maxLen = pct >= 0.12 ? 12 : 7;
      const label  = e[0].length > maxLen ? e[0].slice(0, maxLen - 1) + '…' : e[0];
      const fs     = pct >= 0.10 ? 5.5 : 4.5;
      svgLabels += `<text x="${lx.toFixed(1)}" y="${(ly - 2).toFixed(1)}" text-anchor="middle" font-size="${fs}" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-weight="600" pointer-events="none">${label}</text>`;
      svgLabels += `<text x="${lx.toFixed(1)}" y="${(ly + fs + 0.5).toFixed(1)}" text-anchor="middle" font-size="${(fs - 0.5).toFixed(1)}" fill="rgba(255,255,255,0.75)" font-family="Segoe UI,Arial,sans-serif" pointer-events="none">${pctLabel}</text>`;
    }

    startDeg = endDeg;
  });

  const svg = `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${svgPaths}<g>${svgLabels}</g></svg>`;
  // keep tooltip element, replace rest
  wrap.innerHTML = '<div class="pie-tooltip" id="pieTooltip"></div>' + svg;

  // Top 3
  const top3    = sorted.slice(0, 3);
  const tColors = ['#FF6B35','#2E9CDB','#9B59B6'];
  let t3Html = '';
  top3.forEach((e, i) => {
    const w = Math.round(e[1] / top3[0][1] * 100);
    t3Html += `<div class="t3-item">
      <div class="t3-num" style="background:${tColors[i]}">${i+1}</div>
      <div class="t3-bar-wrap">
        <div class="t3-name" title="${e[0]}">${e[0]}</div>
        <div class="t3-bar" style="width:${w}%;background:${tColors[i]}"></div>
      </div>
      <div class="t3-qty" style="color:${tColors[i]}">${fmt(e[1])}</div>
    </div>`;
  });
  document.getElementById('top3Container').innerHTML = t3Html;
}

// ── Pie slice hover handlers ──────────────────────────
function sliceEnter(el, evt) {
  const tx = parseFloat(el.dataset.tx);
  const ty = parseFloat(el.dataset.ty);
  el.style.transform = `translate(${tx}px,${ty}px)`;
  const tip = document.getElementById('pieTooltip');
  tip.textContent = `${el.dataset.name}  ${el.dataset.pct}  (${parseInt(el.dataset.qty).toLocaleString('en-US')})`;
  tip.style.opacity = '1';
  sliceMove(evt);
}

function sliceLeave(el) {
  el.style.transform = '';
  const tip = document.getElementById('pieTooltip');
  if (tip) tip.style.opacity = '0';
}

function sliceMove(evt) {
  const tip  = document.getElementById('pieTooltip');
  if (!tip || tip.style.opacity === '0') return;
  const wrap = document.getElementById('pieSvgWrap');
  const rect = wrap.getBoundingClientRect();
  let lx = evt.clientX - rect.left + 12;
  let ly = evt.clientY - rect.top  - 10;
  // keep inside wrap
  if (lx + tip.offsetWidth > rect.width)  lx = evt.clientX - rect.left - tip.offsetWidth - 12;
  if (ly < 0) ly = 4;
  tip.style.left = lx + 'px';
  tip.style.top  = ly + 'px';
}

// ── Render Pass/Fail Pie ─────────────────────────────
function getPassFailData() {
  // Real failures mode: use backend QR-level pass/fail data
  if (realFailuresMode && DATA.passFailPie) {
    const pf = DATA.passFailPie;
    // Station-level: return zeros if station not found
    if (activeStation !== 'all') {
      if (pf.byStation && pf.byStation[activeStation]) {
        return pf.byStation[activeStation];
      }
      return { passed: 0, failed: 0, total: 0, yield: 0 };
    }
    // Product-level: return zeros if product not found
    if (activeProduct !== 'all') {
      if (pf.byProduct && pf.byProduct[activeProduct]) {
        return pf.byProduct[activeProduct];
      }
      return { passed: 0, failed: 0, total: 0, yield: 0 };
    }
    return pf.overall;
  }
  // Normal mode: use existing KPI data (already filtered by product/station)
  const k = getCurrentKPI();
  return { passed: k.passed, failed: k.failed };
}

function renderPassFailPie() {
  const wrap = document.getElementById('passFailPieWrap');
  const pf = getPassFailData();
  const passed = pf.passed || 0;
  const failed = pf.failed || 0;
  const total = passed + failed;

  if (!total) {
    wrap.innerHTML = '<div class="pie-tooltip" id="passFailTooltip"></div><div class="no-data" style="margin:auto">No data</div>';
    return;
  }

  const cx = 100, cy = 100, r = 75;
  const passPct = passed / total;
  const failPct = failed / total;
  const passDeg = passPct * 360;

  let paths = '';
  if (passed > 0) {
    const passPath = slicePath(cx, cy, r, 0, passDeg);
    paths += `<path d="${passPath}" fill="#00D4AA" stroke="#0F1923" stroke-width="1"
      onmouseenter="pfSliceEnter(this,event)" onmouseleave="pfSliceLeave(this)" onmousemove="pfSliceMove(event)"
      onclick="showPassFailDetails('PASSED')"
      data-name="PASSED" data-qty="${passed}" data-pct="${(passPct*100).toFixed(1)}%"/>`;
  }
  if (failed > 0) {
    const failPath = slicePath(cx, cy, r, passDeg, passDeg + failPct * 360);
    paths += `<path d="${failPath}" fill="#E74C3C" stroke="#0F1923" stroke-width="1"
      onmouseenter="pfSliceEnter(this,event)" onmouseleave="pfSliceLeave(this)" onmousemove="pfSliceMove(event)"
      onclick="showPassFailDetails('FAILED')"
      data-name="FAILED" data-qty="${failed}" data-pct="${(failPct*100).toFixed(1)}%"/>`;
  }

  // Center label
  const yieldPct = (passPct * 100).toFixed(1);
  const labels = `
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="12" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-weight="700">${yieldPct}%</text>
    <text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="6" fill="#8B9BAA" font-family="Segoe UI,Arial,sans-serif">${fmt(passed)} / ${fmt(total)}</text>
  `;

  const svg = `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    ${paths}
    <circle cx="${cx}" cy="${cy}" r="45" fill="#1A2B3C"/>
    ${labels}
  </svg>`;
  wrap.innerHTML = '<div class="pie-tooltip" id="passFailTooltip"></div>' + svg;
}

function pfSliceEnter(el, evt) {
  const tip = document.getElementById('passFailTooltip');
  tip.textContent = `${el.dataset.name}  ${el.dataset.pct}  (${parseInt(el.dataset.qty).toLocaleString('en-US')})`;
  tip.style.opacity = '1';
  pfSliceMove(evt);
}
function pfSliceLeave(el) {
  const tip = document.getElementById('passFailTooltip');
  if (tip) tip.style.opacity = '0';
}
function pfSliceMove(evt) {
  const tip = document.getElementById('passFailTooltip');
  if (!tip || tip.style.opacity === '0') return;
  const wrap = document.getElementById('passFailPieWrap');
  const rect = wrap.getBoundingClientRect();
  let lx = evt.clientX - rect.left + 12;
  let ly = evt.clientY - rect.top - 10;
  if (lx + tip.offsetWidth > rect.width) lx = evt.clientX - rect.left - tip.offsetWidth - 12;
  if (ly < 0) ly = 4;
  tip.style.left = lx + 'px';
  tip.style.top  = ly + 'px';
}

async function showPassFailDetails(resultado) {
  const from = document.getElementById('dateFrom').value;
  const to   = document.getElementById('dateTo').value;
  const prod = activeProduct;
  const effectiveStationId = activeStation;
  const stationFilter = (effectiveStationId !== 'all' && effectiveStationId != null)
    ? `&stationid=${encodeURIComponent(effectiveStationId)}`
    : '';

  const label = resultado === 'PASSED' ? 'Registros PASSED' : 'Registros FAILED';
  const stationLabel = (effectiveStationId !== 'all' && effectiveStationId != null) ? ` — Station ${effectiveStationId} ` : '';
  document.getElementById('modalTitle').innerText = (prod !== 'all' ? prod + ' ' : '') + stationLabel + '— ' + label;
  const tbody = document.querySelector('#modalTable tbody');
  tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#8B9BAA">Cargando datos...</td></tr>';
  document.getElementById('detailsModal').style.display = 'flex';

  try {
    const url = `/api/passfail_details?from=${from}&to=${to}&product=${prod}${stationFilter}&resultado=${resultado}&real_failures=${realFailuresMode}`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (!resp.ok) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#FF5A5F">Error: ${data.error}</td></tr>`;
      return;
    }
    tbody.innerHTML = '';
    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#8B9BAA">Sin registros.</td></tr>';
      return;
    }
    data.forEach(row => {
      const tr = document.createElement('tr');
      const qr = row.currQr || row.prevQr || '-';
      const resColor = row.resultado === 'PASSED' ? '#00D4AA' : '#E74C3C';
      tr.innerHTML = `
        <td>${qr}</td>
        <td>${row.stationName || '-'}</td>
        <td style="color:${resColor};font-weight:600">${row.resultado || '-'}</td>
        <td>${row.failureCode || '-'}</td>
        <td style="color:#8B9BAA;font-size:10px">${row.endtime || '-'}</td>
      `;
      tbody.appendChild(tr);
    });
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#FF5A5F">Error de conexion.</td></tr>';
  }
}

// ── Anomaly panel ────────────────────────────────────
let _anomalyOpen     = false;
let _anomalyWasShown = false;   // track if panel was ever auto-opened

function toggleAnomalyPanel() {
  _anomalyOpen = !_anomalyOpen;
  document.getElementById('anomalyBody').style.display = _anomalyOpen ? 'block' : 'none';
  document.getElementById('apChevron').classList.toggle('open', _anomalyOpen);
}

async function loadAnomalies() {
  try {
    const product = (typeof activeProduct !== 'undefined' && activeProduct) ? activeProduct : 'all';
    const res  = await fetch(`/api/anomalies?product=${encodeURIComponent(product)}`);
    const data = await res.json();
    renderAnomalies(data);
  } catch (_) {}
}

function renderAnomalies(data) {
  const alerts   = data.alerts || [];
  const panel    = document.getElementById('anomalyPanel');
  const dot      = document.getElementById('apDot');
  const statusEl = document.getElementById('apStatus');
  const countsEl = document.getElementById('apCounts');
  const tsEl     = document.getElementById('apTs');
  const cardsEl  = document.getElementById('anomalyCards');

  if (data.computed_at) {
    // Show only the time portion — date is today by definition
    tsEl.textContent = 'Scanned ' + data.computed_at.slice(11, 16);
  }

  if (!alerts.length) {
    panel.className    = 'anomaly-panel';
    dot.className      = 'ap-dot ok';
    statusEl.className = 'ap-status ok';
    statusEl.textContent = 'All Clear — 24 h';
    countsEl.innerHTML = '';
    cardsEl.innerHTML  = '';
    // Collapse if it was previously open due to an alert
    if (_anomalyOpen) toggleAnomalyPanel();
    return;
  }

  const critCount = alerts.filter(a => a.severity === 'critical').length;
  const warnCount = alerts.length - critCount;

  if (critCount > 0) {
    panel.className    = 'anomaly-panel has-critical';
    dot.className      = 'ap-dot critical';
    statusEl.className = 'ap-status critical';
    statusEl.textContent = 'Station Alerts';
    // Auto-open on first critical detection
    if (!_anomalyOpen && !_anomalyWasShown) { toggleAnomalyPanel(); _anomalyWasShown = true; }
  } else {
    panel.className    = 'anomaly-panel has-warning';
    dot.className      = 'ap-dot warning';
    statusEl.className = 'ap-status warning';
    statusEl.textContent = 'Station Alerts';
  }

  countsEl.innerHTML =
    (critCount ? `<span class="ap-pill critical">${critCount} CRITICAL</span>` : '') +
    (warnCount ? `<span class="ap-pill warning">${warnCount} WARNING</span>`  : '');

  cardsEl.innerHTML = alerts.map(a => {
    // Primary metric: worst FPY drop or streak end FPY
    const worstDrop  = a.drop_alerts.length ? a.drop_alerts[0] : null;
    const streak     = a.streak;

    // Left metric box — FPY drop: color the actual reading by its level so
    // operators instantly see whether 87% is "bad" vs 99% is "barely flagged".
    // The norm reference is also colored so the gap is visually obvious.
    const dropBox = worstDrop ? `
      <div class="ac-metric">
        <div class="ac-metric-label">FPY Drop</div>
        <div class="ac-metric-val" style="color:${yieldColor(worstDrop.fpy)}">${worstDrop.fpy}%</div>
        <div class="ac-metric-sub">vs <span style="color:${yieldColor(worstDrop.mean)}">${worstDrop.mean}%</span> norm &middot; ${worstDrop.hour}</div>
      </div>` : '';

    // Right metric box — streak: show where FPY started (colored green/yellow
    // to show it was acceptable) and where it ended (colored red/yellow to show
    // how far it fell). Reading left-to-right tells the whole story at a glance.
    const streakBox = streak ? `
      <div class="ac-metric">
        <div class="ac-metric-label">${streak.hours}h Decline</div>
        <div class="ac-metric-val">
          <span style="color:${yieldColor(streak.fpy_start)}">${streak.fpy_start}%</span>
          <span style="color:#3A4A5A;font-size:11px;margin:0 3px">&#8594;</span>
          <span style="color:${yieldColor(streak.fpy_end)}">${streak.fpy_end}%</span>
        </div>
        <div class="ac-metric-sub">&#8722;${streak.drop_pts} pts &middot; ${streak.from} &#8594; ${streak.to}</div>
      </div>` : '';

    // Tag chips — concise action labels
    const dropTag   = worstDrop
      ? `<span class="ac-tag drop-tag">&#9660; ${a.drop_alerts.length} drop${a.drop_alerts.length > 1 ? 's' : ''}</span>`
      : '';
    const streakTag = streak
      ? `<span class="ac-tag streak-tag">&#8600; ${streak.hours}h decline</span>`
      : '';

    // Tooltip with raw stats for power users (z-score, p-value)
    const tipParts = [];
    if (worstDrop) tipParts.push(`z=${worstDrop.z_score}  p=${worstDrop.p_value}  threshold=${worstDrop.threshold}%`);
    if (streak)    tipParts.push(`${streak.from} → ${streak.to}`);
    const tip = tipParts.join(' | ');

    return `<div class="alert-card ${a.severity}${a.severity === 'critical' ? ' pulse-glow' : ''}" title="${tip}">
      <div class="ac-top">
        <span class="ac-station" title="${a.station_name}">${a.station_name}</span>
        <span class="ac-prod-pill">${a.product}</span>
      </div>
      <div class="ac-metrics">${dropBox}${streakBox}</div>
      <div class="ac-tags">${dropTag}${streakTag}</div>
    </div>`;
  }).join('');
}

// ── Init ─────────────────────────────────────────────
const _filtersRestored = restoreFilters();
if (!_filtersRestored) initDates();
const _initDates = {
  from: document.getElementById('dateFrom').value,
  to:   document.getElementById('dateTo').value,
};
loadData(_initDates.from, _initDates.to);
loadAnomalies();
// Re-poll anomalies every 15 minutes (aligned with server cache refresh)
setInterval(loadAnomalies, 15 * 60 * 1000);
</script>
</body>
</html>
